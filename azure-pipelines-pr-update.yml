trigger:
  branches:
    include:
    - feature/*
    - feat/*

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: PowerShell@2
  displayName: 'Update PR Description'
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
  inputs:
    targetType: 'inline'
    script: |
      $headers = @{
        Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN"
        "Content-Type" = "application/json"
      }
      
      # Get PR for this branch
      $org = "$(System.TeamFoundationCollectionUri)"
      $project = "$(System.TeamProject)"
      $repo = "$(Build.Repository.Name)"
      $branch = "$(Build.SourceBranchName)"
      
      $prUrl = "$org$project/_apis/git/repositories/$repo/pullrequests?searchCriteria.sourceRefName=refs/heads/$branch&api-version=7.0"
      $prs = Invoke-RestMethod -Uri $prUrl -Headers $headers
      
      if ($prs.count -gt 0) {
        $pr = $prs.value[0]
        $prId = $pr.pullRequestId
        
        # Get commits
        $commits = git log --pretty=format:"- %s" origin/main..HEAD
        
        # Update PR
        $body = @{
          description = $pr.description + "`n`n## Recent Changes`n$commits"
        } | ConvertTo-Json
        
        $updateUrl = "$org$project/_apis/git/repositories/$repo/pullrequests/$prId?api-version=7.0"
        Invoke-RestMethod -Uri $updateUrl -Headers $headers -Method Patch -Body $body
      }