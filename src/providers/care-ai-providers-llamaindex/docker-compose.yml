version: '3.8'

services:
  llamaindex-provider:
    build: .
    container_name: llamaindex-provider
    ports:
      - "5051:5051"
    environment:
      - OLLAMA_ENDPOINT=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3-clean:latest
    networks:
      - care-ai-network

networks:
  care-ai-network:
    driver: bridge