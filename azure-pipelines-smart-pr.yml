trigger:
  branches:
    include:
    - feature/*

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  fetchDepth: 0

- task: PowerShell@2
  displayName: 'Analyze with Care.AI and Update PR'
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    CARE_AI_URL: $(CareAiUrl) # Set in pipeline variables
  inputs:
    targetType: 'inline'
    script: |
      # Get diff and commits
      $diff = git diff origin/main...HEAD
      $commits = git log --pretty=format:"%s" origin/main..HEAD
      
      # Call Care.AI
      $body = @{
        type = "chat-completion"
        data = @{
          messages = @(
            @{
              role = "user"
              content = "Summarize these changes in 2-3 bullets: $commits"
            }
          )
        }
      } | ConvertTo-Json -Depth 10
      
      $analysis = Invoke-RestMethod -Uri "$env:CARE_AI_URL/api/kernel/execute" `
        -Method Post -Body $body -ContentType "application/json"
      
      # Update PR
      $headers = @{
        Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN"
      }
      
      $prUrl = "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_apis/git/pullrequests?sourceRefName=$(Build.SourceBranch)&api-version=7.0"
      $pr = (Invoke-RestMethod -Uri $prUrl -Headers $headers).value[0]
      
      if ($pr) {
        $newDescription = $pr.description + "`n`n## AI Summary`n" + $analysis.result.message
        
        Invoke-RestMethod -Uri "$prUrl/$($pr.pullRequestId)" -Headers $headers -Method Patch -Body (@{
          description = $newDescription
        } | ConvertTo-Json)