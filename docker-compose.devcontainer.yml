version: '3.8'

services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "5001:5001"
      - "3500:3500"
      - "6050:6050"
      - "50005:50005"
    environment:
      - REMOTE_CONTAINERS=true
    working_dir: /workspace
    command: |
      bash -c "
        bash /workspace/.devcontainer/post-create.sh
        nohup /home/vscode/start-placement.sh > /tmp/placement.log 2>&1 &
        sleep 3
        echo 'DevContainer ready! Placement service running on port 6050'
        echo 'Run: cd Care.Ai.AppHost && dotnet run'
        tail -f /dev/null
      "
    stdin_open: true
    tty: true