[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:placement]
command=/dapr/bin/placement -port 50005
autostart=true
autorestart=true
stderr_logfile=/tmp/placement.err.log
stdout_logfile=/tmp/placement.out.log

[program:scheduler]
command=/dapr/bin/scheduler -port 50006
autostart=true
autorestart=true
stderr_logfile=/tmp/scheduler.err.log
stdout_logfile=/tmp/scheduler.out.log